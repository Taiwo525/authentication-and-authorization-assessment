spring:
  application:
    name: sample-application

  datasource:
    url: jdbc:postgresql://localhost:5432/sample_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  starter:
    jwt-secret: ${JWT_SECRET:Yw8mNpQs5tVxZa3bCdEfGhJkLr7uWy9zAbCdEfGhJkLmNp}
    token-expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
    token-issuer: ${JWT_ISSUER:sample-application}

logging:
  level:
    com.assessment: DEBUG
    org.springframework.security: INFO

server:
  port: 8089